name: ci

on:
  push:
    # ドキュメント (**.md / **.txt) は vp check の整形検証対象であるため除外しない。
    # LICENSE / NOTICE は体裁を持たない法務文書のため除外する。
    paths-ignore:
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "22"
          cache: true
      # vp check は整形・lint・型をまとめて検証する。整形崩れも CI で止めるため
      # vp lint ではなく vp check を使う (型は別 job で複数バージョンを検証する)。
      - run: vp check

  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      matrix:
        node:
          - "26"
          - "24"
          - "22"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp test
      - run: vp run build

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # WebCodecs Audio 型 (AudioDecoder 等) は TypeScript 5.7 の lib.dom.d.ts で追加
        typescript:
          # - "@typescript/native-preview@beta"
          # 出荷標準 (package.json の devDependencies.typescript) を先頭に置く
          - "7.0.2"
          - "next"
          - "6.0"
          - "5.9"
          - "5.8"
          # 5.7 は WebCodecs Audio 型 (AudioDecoder 等) が lib.dom.d.ts に
          # 追加された下限であり、対応可能な最小バージョンとして残す
          - "5.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "22"
      # package.json の typescript バージョンを書き換えて再インストール
      - run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.devDependencies.typescript = '${{ matrix.typescript }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: vp install --no-frozen-lockfile
      - run: vp run typecheck

  e2e:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp exec playwright install --with-deps chromium
      - run: vp run e2e-test

  slack-notify:
    needs: [lint, build, typecheck, e2e]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
