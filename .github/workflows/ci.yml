name: ci

on:
  push:
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp lint

  build:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      matrix:
        node:
          - "26"
          - "24"
          - "22"
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node }}
          cache: true
      - run: vp test
      - run: vp run build

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # WebCodecs Audio 型 (AudioDecoder 等) は TypeScript 5.7 の lib.dom.d.ts で追加
        typescript:
          # - "@typescript/native-preview@beta"
          - "next"
          - "6.0"
          - "5.9"
          - "5.8"
          - "5.7"
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
      # package.json の typescript バージョンを書き換えて再インストール
      - run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.devDependencies.typescript = '${{ matrix.typescript }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - run: vp install --no-frozen-lockfile
      - run: vp run typecheck

  e2e:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp exec playwright install --with-deps chromium
      - run: vp run e2e-test
        env:
          TEST_MOQT_QUIC_URI: ${{ secrets.TEST_MOQT_QUIC_URI }}
          TEST_MOQT_AUTH_TOKEN: ${{ secrets.TEST_MOQT_AUTH_TOKEN }}

  slack-notify:
    needs: [lint, build, typecheck, e2e]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
