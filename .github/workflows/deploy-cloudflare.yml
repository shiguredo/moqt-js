name: Deploy DevTools to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-devtools
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    # DevTools をビルドしてデプロイするため ubuntu-slim では足りない
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "22"

      - name: 依存をインストールする
        run: vp install --frozen-lockfile

      - name: ライブラリをビルドする
        run: vp run build

      - name: Java をセットアップする
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: shaka-player を取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shaka-project/shaka-player
          ref: ef7e1bf63845df228665af0f93a77667fb84f8b0
          path: _shaka-player

      - name: shaka-player の依存をインストールする
        working-directory: _shaka-player
        run: npm ci

      - name: shaka-player の experimental build を作る
        working-directory: _shaka-player
        run: python3 build/all.py --force --release

      - name: Web アプリをビルドする
        env:
          SHAKA_DIST: ${{ github.workspace }}/_shaka-player/dist
        run: vp run build:web

      - name: Cloudflare Pages にデプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          commit_message="$(git log -1 --pretty=%s)"
          vp dlx wrangler@latest pages deploy devtools/dist \
            --project-name=shiguredo-moqt-devtools \
            --commit-message="${commit_message}"

  slack-notify:
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: ${{ secrets.SLACK_CHANNEL }}
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
