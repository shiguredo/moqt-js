# GitHub Actions による実リレーへの接続テスト
#
# - secrets.TEST_MOQT_URI が指す MOQT リレーへ実ブラウザ (Chromium) から接続し、
#   SETUP の交換、publish / subscribe、FETCH を検証する
# - secrets.TEST_MOQT_URI には moqt:// の URI を指定する
# - secret が未設定の場合 (fork からの PR など) はテストを実行せず、ジョブは成功させる。
#   テスト側も TEST_MOQT_URI が未設定なら skip する (二重の防御)
# - 公開ログにリレーのホストやトークンを残さないよう、接続先 (host / authority) と
#   fragment を ::add-mask:: でマスクする
# - 接続先のリレー (sora-moq) が draft-22 の ALPN (moqt-22) に対応したため自動実行する。
#   一時停止していた間は push / pull_request トリガーを外していた (5d01fcdc)。

name: e2e-test

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    # 実リレーへ接続する E2E テスト。判定は絶対値 (音声の基準の遅れが 10〜30 ms に収まる)
    # ではなく、実装が保証する不変条件に切り替えた (tests/e2e/relay/audio-timestamp.spec.ts)。
    # 基準の遅れの値そのものは runner の処理能力で変わるため判定には使わず、失敗したときに
    # 「環境が遅いのか実装が壊れているのか」を切り分けられるようメッセージへ記録する。
    #
    # ubuntu-slim (1 vCPU) はジョブの要件を満たさない。Playwright のコンテナで実測
    # (2026-10-10):
    # - 1 vCPU: 受信側の音声の基準の遅れが 157〜1780 ms まで育つ。実装の共有の上限を超えて
    #   共有が成立しないまま待ちがタイムアウトするか、経路の段差で解除されたまま観測が
    #   終わる。落ち着いた環境では 5 回中 3 回通ったが、他の負荷と重なった回は 5 回中 0 回
    # - 2 vCPU: 5/5 通る (1 回 34〜36 秒)。ローカルの Mac も 5/5 通る
    # テストの前提 (受信側が実時間に追いつき、共有が成立し続けること) を runner が満たす
    # 必要があるため、2 vCPU 以上が確実な 4 vCPU の ubuntu-24.04 を使う。trace は relay
    # プロジェクトだけ切ってある (playwright.config.ts)。trace のスクリーンキャストも
    # 同じコアを奪い、計測を歪めるため
    runs-on: ubuntu-24.04
    # Chromium の install と、実リレーを相手にしたテストを見込んで余裕を持たせる
    timeout-minutes: 20
    env:
      TEST_MOQT_URI: ${{ secrets.TEST_MOQT_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "22"
          cache: true

      - name: TEST_MOQT_URI が未設定の場合はスキップする
        if: env.TEST_MOQT_URI == ''
        run: echo "TEST_MOQT_URI is not set; skipping the relay e2e test"

      # secrets 全体は GitHub が自動でマスクするが、ログには host や authority が
      # 単体で現れることがある (Playwright のエラー出力、Chromium のログなど)
      - name: 接続先の host と fragment をマスクする
        if: env.TEST_MOQT_URI != ''
        run: |
          set -euo pipefail

          authority="${TEST_MOQT_URI#*://}"
          authority="${authority%%/*}"
          authority="${authority%%[?#]*}"
          if [ "${authority#\[}" != "$authority" ]; then
            # IPv6 リテラルは `[...]` の中身を host とする
            host="${authority#[}"
            host="${host%%]*}"
          else
            host="${authority%%:*}"
          fi
          echo "::add-mask::$host"
          echo "::add-mask::$authority"
          if [ "${TEST_MOQT_URI#*#}" != "$TEST_MOQT_URI" ]; then
            echo "::add-mask::${TEST_MOQT_URI#*#}"
          fi

      - name: 依存関係をインストールする
        if: env.TEST_MOQT_URI != ''
        run: vp install

      - name: Chromium をインストールする
        if: env.TEST_MOQT_URI != ''
        run: vp exec playwright install --with-deps chromium

      - name: 実リレーへ接続する E2E テストを実行する
        if: env.TEST_MOQT_URI != ''
        run: vp run e2e-test:relay
