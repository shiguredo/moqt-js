minimumReleaseAge: 2880

packages:
  - devtools
  - examples
  # 実リレーへ接続する Playwright E2E のテストページ (tests/e2e/vite.config.ts)
  - tests/e2e

overrides:
  # vite と vitest を vite-plus 同梱の実体 1 つに統一する。
  # この override が無いと pnpm は peer 解決コンテキストの違いで
  # 同一バージョンの vitest を 2 インスタンスに分ける。
  # @fast-check/vitest と vitest 本体が別モジュールになると、
  # prop テストが Vitest failed to find the current suite で失敗する。
  # vite-plus-core は vite-plus と同版でリリースされるため、
  # vite-plus の更新時はこの版と package.json の vite-plus を揃えること。
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest@*: 5.1.0

allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@preact/signals"
  - "vite-plus"
  - "@voidzero-dev/vite-plus-core"
  - "@voidzero-dev/vite-plus-darwin-arm64"
  - "@voidzero-dev/vite-plus-darwin-x64"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu"
  - "@voidzero-dev/vite-plus-linux-arm64-musl"
  - "@voidzero-dev/vite-plus-linux-x64-gnu"
  - "@voidzero-dev/vite-plus-linux-x64-musl"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc"
  - "@voidzero-dev/vite-plus-win32-x64-msvc"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
