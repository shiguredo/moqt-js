# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "vp-check",
    name = "vp check",
    entry = "vp check --fix",
    language = "system",
    types_or = [
      "ts",
      "tsx",
      "javascript",
      "jsx",
      "css",
      "json",
    ],
    pass_filenames = false
  },
  {
    id = "vp-typecheck",
    name = "vp typecheck",
    entry = "vp run typecheck",
    language = "system",
    types_or = [
      "ts",
      "tsx",
    ],
    pass_filenames = false
  },
  {
    id = "vp-test",
    name = "vp test",
    entry = "vp test run",
    language = "system",
    types_or = [
      "ts",
      "tsx",
    ],
    pass_filenames = false
  },
]
