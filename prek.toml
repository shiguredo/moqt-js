# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# 最初に失敗したフックで残りをスキップする
fail_fast = true
# stages 未指定のフックは pre-commit でだけ実行される
default_stages = ["pre-commit"]
# prek install で pre-commit と pre-push の両方の Git フックを入れる
default_install_hook_types = ["pre-commit", "pre-push"]
# IETF draft 原文は整形・構文チェックの対象外にする
exclude = { glob = ["refs/**"] }

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  # 行末の空白を取り除く
  { id = "trailing-whitespace" },
  # ファイル末尾を改行 1 つで終わらせる
  { id = "end-of-file-fixer" },
  # ファイル先頭の UTF-8 BOM を取り除く
  { id = "fix-byte-order-marker" },
  # TOML の構文エラーを検出する
  { id = "check-toml" },
  # YAML の構文エラーを検出する
  { id = "check-yaml" },
  # JSON の構文エラーと重複キーを検出する
  # tsconfig.json などはコメント付き JSONC のため除外
  { id = "check-json", exclude = "(^|/)tsconfig.*\\.json$" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 大文字小文字だけが異なるファイル名の衝突を防ぐ
  { id = "check-case-conflict" },
  # Windows で使えないファイル名の混入を防ぐ
  { id = "check-illegal-windows-names" },
  # 大きなファイルの誤コミットを防ぐ
  { id = "check-added-large-files" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
  # 改行コードの混在を防ぐ
  { id = "mixed-line-ending" },
  # リンク切れのシンボリックリンクを検出する
  { id = "check-symlinks" },
  # シンボリックリンクだったファイルが実体ファイルとしてコミットされるのを検出する
  { id = "destroyed-symlinks" },
  # 実行権限のあるファイルに shebang があるか確認する
  { id = "check-executables-have-shebangs" },
  # shebang 付きスクリプトに実行権限があるか確認する
  { id = "check-shebang-scripts-are-executable" },
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.1"
hooks = [{ id = "tombi-lint" }, { id = "tombi-format" }]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# vp check: フォーマット (oxfmt) と lint (oxlint type-aware) をまとめて実行
[[repos.hooks]]
id = "vp-check"
name = "vp check"
entry = "vp check"
language = "system"
types_or = ["ts", "tsx", "javascript", "jsx", "css", "json"]
pass_filenames = false
priority = 0

# tsc --noEmit: TypeScript の型チェック
[[repos.hooks]]
id = "vp-typecheck"
name = "tsc --noEmit"
entry = "vp exec tsc --noEmit"
language = "system"
types_or = ["ts", "tsx"]
pass_filenames = false
priority = 10

# vp test: コミットを遅くしないため pre-push でだけ実行する
[[repos.hooks]]
id = "vp-test"
name = "vp test"
entry = "vp test run"
language = "system"
types_or = ["ts", "tsx"]
pass_filenames = false
stages = ["pre-push"]
priority = 20
